name: Deploy QWEMU to Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Подтверди публикацию production Worker"
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "yes"
      health_url:
        description: "Необязательно: полный HTTPS URL /api/health после публикации"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: qwemu-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm_production == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run all local checks
        run: |
          npm run check
          npm run test:integration

      - name: Prepare production Wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          RATE_LIMIT_SECRET: ${{ secrets.RATE_LIMIT_SECRET }}
        run: node scripts/prepare-deploy.mjs

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler --config wrangler.deploy.jsonc whoami

      - name: Check workers.dev subdomain before D1 changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-cloudflare.mjs

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler --config wrangler.deploy.jsonc d1 migrations apply qwemu-web --remote

      - name: Deploy Worker with secrets in one version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler --config wrangler.deploy.jsonc deploy --secrets-file wrangler.secrets.json

      - name: Verify production health endpoint
        if: ${{ github.event.inputs.health_url != '' }}
        env:
          QWEMU_HEALTH_URL: ${{ github.event.inputs.health_url }}
        run: |
          node --input-type=module <<'NODE'
          const target = process.env.QWEMU_HEALTH_URL;
          const url = new URL(target);
          if (url.protocol !== 'https:' || !url.pathname.endsWith('/api/health')) {
            throw new Error('health_url должен быть полным HTTPS URL, оканчивающимся на /api/health');
          }
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.ok !== true || payload.databaseReady !== true || payload.rateLimitConfigured !== true || payload.rateLimitStrong !== true) {
            throw new Error(`Production health check failed: HTTP ${response.status}`);
          }
          console.log('Production API health: PASS');
          NODE

      - name: Remove temporary config
        if: always()
        run: rm -f wrangler.deploy.jsonc wrangler.secrets.json
